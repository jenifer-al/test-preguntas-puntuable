<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>TEST</title>
</head>
<body class="bg-gradient-to-br from-emerald-400 via-teal-200 to-cyan-100 min-h-screen">

    <header class="w-[300px] mx-auto mt-3 mb-10 p-[1px] rounded-[2rem] bg-gradient-to-r from-teal-400 via-indigo-500
     to-blue-500 shadow-[0_0_10px_rgba(99,102,241,0.3)] sm:w-[600px] sm:p-[4px] md:w-[700px] md:p-[6px] lg:w-[1000px] lg:p-[6px] 
     xl:w-[1260px] xl:p-[6px] 2xl:w-[1500px] 2xl:p-[6px] [@media(min-width:1920px)]:w-[1700px] [@media(min-width:1920px)]:p-[8px]">
        <div class="bg-[url(imagenes/retulo.jpg)] bg-[length:100%_100%] rounded-[1.8rem] pt-1 py-3 sm:py-4 md:py-8 lg:py-9 xl:py-10 
        2xl:py-11 [@media(min-width:1920px)]:py-12">
            <h1 class="text-center text-xl text-indigo-900 font-bold drop-shadow-[0_2px_2px_rgba(255,255,255,0.8)] 
            transition-transform duration-500 sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl 2xl:text-8xl [@media(min-width:1920px)]:text-9xl">
                TEST
            </h1>
        </div>
    </header>

    <div>
        <img class="mx-auto w-[70px] sm:w-[100px] md:w-[120px] lg:w-[160px] xl:w-[160px] 2xl:w-[160px]" src="imagenes/interrogante.gif" alt="un gif"/>
    </div>

    <main class="px-4">
      

        <form id="form-test">
            <div id="contenedor-pregunta" class="grid grid-cols-1 justify-items-center  mt-10 w-full mx-auto">
            </div>

                <div class="mt-10 text-center mb-5 space-x-2">
                    <button id="btnAnterior" class="mb-1 border rounded-2xl border-teal-600 px-2 cursor-pointer
                    bg-gradient-to-r from-teal-400 via-indigo-500 to-blue-500 text-white font-bold border-4
                    transition-all duration-300 hover:scale-105 hover:shadow-lg active:scale-95" type="button">PREGUNTA ANTERIOR</button>
                
                    <button id="btnSiguiente" class="mb-1 border rounded-2xl border-teal-600 px-2 cursor-pointer
                    bg-gradient-to-r from-teal-400 via-indigo-500 to-blue-500 text-white font-bold border-4
                    transition-all duration-300 hover:scale-105 hover:shadow-lg active:scale-95" type="button">PREGUNTA SIGUIENTE</button>
                    <button id="btnReiniciar" class="sm:mt-1 border rounded-2xl border-teal-600 px-2 cursor-pointer
                    bg-gradient-to-r from-teal-400 via-indigo-500 to-blue-500 text-white font-bold border-4 
                    transition-all duration-300 hover:scale-105 hover:shadow-lg active:scale-95" type="button">REINICIAR TEST</button>
                    <button id="btnFinalizar" class="mb-1 border rounded-2xl border-teal-600 px-2 cursor-pointer
                    bg-gradient-to-r from-red-500 to-orange-500 text-white font-bold border-4 transition-all
                    duration-300 hover:scale-105 hover:shadow-lg active:scale-95" type="button">FINALIZAR TEST</button>

                    
                </div>


         
        </form>
    </main>


            <dialog id="dialogConfirmar" class="rounded-xl p-6 shadow-lg">
                    <h2 class="text-xl font-bold mb-4">Confirmar respuesta</h2>

                    <p id="textoDialog" class="mb-6">
                        ¿Deseas confirmar esta respuesta?
                    </p>

                    <div class="flex justify-center gap-4">
                        <button id="btnConfirmar" type="button"
                            class="bg-green-600 text-white px-4 py-2 rounded-lg">
                            Sí
                        </button>

                        <button id="btnCancelar" type="button"
                            class="bg-red-600 text-white px-4 py-2 rounded-lg">
                            No
                        </button>
                    </div>
</dialog>


<dialog id="dialogCorreo" class="rounded-xl p-6 shadow-lg">

    <h2 class="text-xl font-bold mb-4">
        Enviar resultados
    </h2>

    <form id="formCorreo">

        <label class="block mb-3 font-semibold">
            Indica tu mail para enviar los resultados
        </label>

        <input
            id="correo"
            type="email"
            required
            maxlength="80"
            placeholder="correo@ejemplo.com"
            class="border rounded-lg p-2 w-full">

        <div class="flex justify-center gap-4 mt-6">

            <button
                type="submit"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg">

                Enviar

            </button>

            <button
                id="cerrarCorreo"
                type="button"
                class="bg-red-600 text-white px-4 py-2 rounded-lg">

                Cancelar

            </button>

        </div>

    </form>

</dialog>

    <script src="js/dato-test.js"></script>
    <script src="js/test.js"></script>
</body>
</html>
